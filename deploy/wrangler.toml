# Wedding Brawl on Cloudflare: ./build.sh, then npx wrangler deploy (from this folder). Public: the photos are on it.
name = "wedding-brawl"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "wedding-brawl.grinevich.cc", custom_domain = true }]
assets = { directory = "public", binding = "ASSETS" }

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]
